server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # ====================================================================
        # ROUTE: ORDER SERVICE (Đã sửa lỗi Service ID: orders-service -> order-service)
        # ====================================================================
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

# ============================================================================
# CẤU HÌNH EUREKA CLIENT ĐỂ ĐỒNG BỘ SERVICE REGISTRY
# ============================================================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# ============================================================================
# CẤU HÌNH LOG TRACE/DEBUG ĐỂ THEO DÕI QUÁ TRÌNH TÌM KIẾM INSTANCE QUA LOADBALANCER
# ============================================================================
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty.http.client: DEBUG
